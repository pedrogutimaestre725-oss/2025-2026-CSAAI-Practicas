<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inazuma League</title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="logo.ico" type="image/x-icon">
</head>
<body>

<!-- OVERLAY (MENÚ + FINAL) -->
<div id="overlay">
  <div id="menu">
    <h1>⚽ INAZUMA LEAGUE ⚽</h1>
    <p>Selecciona modo:</p>
    <p>1 → Gol de oro</p>
    <p>2 → A 3 goles</p>
  </div>

  <div id="final" style="display:none;"></div>
</div>

<!-- UI SUPERIOR -->
<div id="topUI">
  <h1>INAZUMA LEAGUE</h1>
  <div id="scoreboard">
    <img id="blueLogo" src="logo1.png" alt = "azul">
    <span id="blueScore">0</span>

    <span id="time">00:00</span>

    <span id="redScore">0</span>
    <img id="redLogo" src="logo2.png" alt = "rojo">
  </div>
</div>

<!-- CANVAS -->
<canvas id="game"></canvas>

<div id="controlsInfo">
  WASD (controles de dirección) / Espacio para chutar / R para reiniciar la pelota
</div>

<!-- MENSAJES -->
<div id="countdown"></div>
<div id="goalMsg"></div>

<div id="mobileControls">

  <div class="dpad">
    <button id="up">⬆️</button>

    <div class="middleRow">
      <button id="left">⬅️</button>
      <button id="down">⬇️</button>
      <button id="right">➡️</button>
    </div>
  </div>

  <div class="menuButtons">
    <button id="btn1">1</button>
    <button id="btn2">2</button>
  </div>

  <div class="actions">
    <button id="shoot">👢</button>
    <button id="reset">R</button>
  </div>

</div>

<script src="game.js"></script>
</body>
</html>

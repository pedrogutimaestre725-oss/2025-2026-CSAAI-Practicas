<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beat The F1 Word</title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="F1.ico" type="image/x-icon"> 
</head>
<body>

<header>
  <h1>🎵 Beat The F1 Word</h1>
  <div class="status">
    <span>Nivel: <b id="nivel">1</b>/5</span>
    <span>Tiempo: <b id="tiempo">0.0</b>s</span>
    <span>Estado: <b id="estado">En espera</b></span>
  </div>
</header>

<main>

  <aside class="panel">
    <h2>⚙️ Configuración</h2>

    <label>Secuencia</label>
    <select id="wordSet">
      <option value="nano">Nano / Amo</option>
      <option value="max">Mad / Max</option>
      <option value="maze">Maze / Spin</option>
    </select>

    <label>Nivel inicial</label>
    <select id="startLevel">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
    </select>

    <label>
      <input type="checkbox" id="showText" checked>
      Mostrar texto
    </label>

    <br>

    <label>
      <input type="checkbox" id="voiceMode">
      Activar función VAR (reconocimiento de voz)
    </label>

    <button id="startBtn">▶ Empezar</button>
    <button id="stopBtn">⛔ Detener</button>
    <button id="recordBtn">🎤 Grabar</button>
  </aside>

  <section class="game">
    <!-- 🔥 SOLUCION ERROR SECTION -->
    <h2 style="display:none;">Área de juego</h2>

    <div class="game-header">
      <span id="gameLevel">1/5</span>
      <button id="musicBtn">🔊 Música ON</button>
    </div>

    <div id="message">Pulsa "Empezar"</div>

    <div class="grid" id="grid"></div>
  </section>

</main>

<script src="game.js"></script>
</body>
</html>
